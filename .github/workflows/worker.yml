name: Autonomous Publishing Worker

on:
  schedule:
    # Executes every 15 minutes around the clock
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Ensure only one scheduled run executes at a time; do not cancel in-progress runs
concurrency:
  group: worker-execution
  cancel-in-progress: false

jobs:
  run-worker-job:
    name: Run Autonomous Worker Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r run build

      - name: Run worker with 11-minute time budget
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          WORKER_TIME_BUDGET: 11m
        run: pnpm run worker:once -- --time-budget=11m
